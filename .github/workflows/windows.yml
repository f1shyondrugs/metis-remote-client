name: Remote Client desktop releases

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            command: build:win
          - os: macos-latest
            platform: macos
            command: build:mac
          - os: ubuntu-latest
            platform: linux
            command: build:linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Confirm release tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: test "v$(node -p "require('./desktop/package.json').version")" = "${{ github.ref_name }}"
      - name: Test client
        run: node --test tests/*.test.mjs
      - name: Install dependencies
        run: npm ci --prefix desktop
      - name: Build desktop installer
        run: npm run ${{ matrix.command }} --prefix desktop -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: metis-remote-client-${{ matrix.platform }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
            desktop/dist/*.yml
            desktop/dist/*.blockmap
          if-no-files-found: error
          retention-days: 7
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: metis-remote-client-*
          path: release
          merge-multiple: true
      - name: Publish complete release after every platform succeeds
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" release/* --title "Metis AI Remote Client ${{ github.ref_name }}" --generate-notes --verify-tag --latest
